name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify merge came from a PR (no direct pushes)
        env:
          HEAD_COMMIT: ${{ github.sha }}
        run: |
          # Squash-merge commits are "Desc (#N)"; merge-commits are "Merge pull request #N".
          msg="$(git log -1 --format=%s "$HEAD_COMMIT")"
          echo "HEAD commit: $msg"
          if ! printf '%s' "$msg" | grep -qE '#[0-9]+'; then
            echo "::error::Direct push to main is not allowed. Open a PR and merge it instead."
            exit 1
          fi

      - name: Run deploy
        run: bash scripts/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}